[package]
name = "yank-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
directories.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
yank-core = { path = "../yank-core" }
yank-ditto = { path = "../yank-ditto" }
rutis = "=0.21.0"
tokio.workspace = true
sha2.workspace = true
hex.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
regex.workspace = true
nsh-core = { workspace = true, features = ["svg"] }
nsh-base.workspace = true
base64 = "0.22"
rand = "0.9"
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring", "portmapper"] }
mdns-sd = "0.17"

[target.'cfg(not(target_os = "android"))'.dependencies]
auto-launch = "0.6.0"
nsh-updater.workspace = true
tempfile.workspace = true
clipboard-rs = { version = "0.3.5", features = ["wayland"] }
active-win-pos-rs = "0.11"
enigo = "0.6.1"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { workspace = true, default-features = false }
[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { workspace = true, default-features = false }
[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { workspace = true, default-features = false }

[dev-dependencies]
axum.workspace = true
nsh-engine = { workspace = true, default-features = false }
nsh-testing = { workspace = true, default-features = false }
tempfile.workspace = true
iroh-relay = { version = "=1.4.1", features = ["server"] }
