name: Release packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUSTUP_TOOLCHAIN: "1.97.0"

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  desktop:
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: windows-2022
            platform: windows-x86_64
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install NSH Linux dependencies
        if: runner.os == 'Linux'
        run: bash scripts/package-linux-deps.sh
      - name: Build standalone client and server
        run: cargo build --locked --release -p yank-client -p yank-server
      - name: Package and inspect
        run: python scripts/package-desktop.py --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-assets-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
  android:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/checkout@v6.0.2
        with:
          repository: longbridge/nsh
          ref: f4d68f7f9f31eb7b3ecc8a4cbc31096d5c6238a1
          path: .nsh-toolchain
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install native and Android SDK dependencies
        run: |
          bash scripts/package-linux-deps.sh
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Build pinned NSH CLI and Android runtime from the same commit
        working-directory: .nsh-toolchain
        run: |
          test "$(git rev-parse HEAD)" = f4d68f7f9f31eb7b3ecc8a4cbc31096d5c6238a1
          cargo build --locked --release -p nsh-cli
          ./target/release/nsh --version
          cargo run --locked -p xtask -- android --release --abi arm64-v8a
      - name: Package debug-signed APK (no store signing identity configured)
        env:
          # runtime.rs expects <root>/android/release. Reuse the pinned arm64
          # runtime rather than triggering its fallback build of all three ABIs.
          NSH_RUNTIME: ${{ github.workspace }}/.nsh-toolchain/target
        run: bash scripts/package-android.sh "$GITHUB_WORKSPACE/.nsh-toolchain/target/release/nsh"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-assets-android-arm64-debug
          path: dist/*
          if-no-files-found: error
  release:
    if: github.ref_type == 'tag'
    needs: [desktop, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-assets-*
          path: dist
          merge-multiple: true
      - name: Verify checksums
        working-directory: dist
        run: |
          for manifest in SHA256SUMS-*.txt; do sha256sum -c "$manifest"; done
      - name: Upload draft release for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" \
              --notes 'Linux deb and desktop binaries. Android arm64 APK uses a debug signing key for testing only; it is not a store release and cannot guarantee update compatibility across builds. Desktop binaries are unsigned; macOS is not notarized.'
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
