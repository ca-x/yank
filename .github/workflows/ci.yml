name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUSTUP_TOOLCHAIN: "1.97.0"

jobs:
  proto:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.75.0"
          github_token: ${{ github.token }}
      - name: Install pinned Prost generator
        run: cargo install --locked protoc-gen-prost --version 0.5.0
      - name: Lint and verify generated sources (including added or removed files)
        shell: bash
        run: |
          buf lint
          buf generate --output "$RUNNER_TEMP/yank-buf"
          diff -ru crates/yank-proto/src/generated "$RUNNER_TEMP/yank-buf/crates/yank-proto/src/generated"
  test:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt
      - name: Install NSH Linux dependencies
        if: runner.os == 'Linux'
        run: bash scripts/package-linux-deps.sh
      - name: Format
        run: cargo fmt --all --check
      - name: Check all targets
        run: cargo check --locked --workspace --all-targets
      - name: Tests
        run: cargo test --locked --workspace
